[package]
name = "oncocalculate-core"
version = "1.0.0"
edition = "2021"
description = "Pure Rust calculation engine for oncology medical calculators"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
